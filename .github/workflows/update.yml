name: Merge Nodes
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
      timezone: "Asia/Shanghai" 
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          
      - name: Install deps
        run: npm install yaml node-fetch
        
      - name: Update subscription URL
        run: |
          TODAY=$(date +'%Y%m%d')
          sed -i "s|https://raw.githubusercontent.com/free-nodes/clashfree/main/sub.yml|https://raw.githubusercontent.com/free-nodes/clashfree/main/clash${TODAY}.yml|g" nodes/subs.json
        
      - name: Run merge script
        run: node nodes/merge.js
        
      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nodes/all.yaml nodes/regionfiltered.yaml
          git commit -m "Auto update all.yaml and regionfiltered.yaml" || echo "No change"
          git push
