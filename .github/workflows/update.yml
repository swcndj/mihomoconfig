name: Merge Nodes
on:
  workflow_dispatch:
  schedule:
    - cron: "7 */3 * * *"
      timezone: "Asia/Shanghai" 
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install deps
        run: npm install yaml node-fetch
      - name: Run merge script
        run: node merge.js
      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nodes.yaml
          git commit -m "Auto update nodes.yaml" || echo "No change"
          git push
