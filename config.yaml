# ======================================== 路由规则 ========================================
rules:
  # 私有域名、IP、自定义直连
  - RULE-SET,private,DIRECT
  - RULE-SET,ip_private,DIRECT,no-resolve
  - PROCESS-NAME,subs-check,DIRECT
  - PROCESS-NAME,subs-check.exe,DIRECT
  - DOMAIN-SUFFIX,loz.dpdns.org,DIRECT
  - DOMAIN-SUFFIX,gamer520.com,DIRECT
  # 广告拒绝
  - RULE-SET,AWAvenue-Ads,REJECT
  - RULE-SET,category-ads-all,REJECT
  # 域名分流，国外精确域名代理→国内直连→国外地理定位代理
  - RULE-SET,cloudflare,自动选择
  - RULE-SET,github,自动选择
  - RULE-SET,youtube,自动选择
  - RULE-SET,google,自动选择
  - RULE-SET,netflix,自动选择
  - RULE-SET,telegram,自动选择
  - RULE-SET,twitter,自动选择
  - RULE-SET,category-ai-!cn,自动选择
  - RULE-SET,category-games@cn,DIRECT
  - RULE-SET,category-game-platforms-download@cn,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,onedrive,DIRECT
  - RULE-SET,microsoft,DIRECT
  - RULE-SET,tracker,DIRECT
  - RULE-SET,cn,DIRECT
  - RULE-SET,geolocation-!cn,自动选择
  # IP分流，国外代理→国内直连
  - RULE-SET,ip_cloudflare,自动选择,no-resolve
  - RULE-SET,ip_google,自动选择,no-resolve
  - RULE-SET,ip_netflix,自动选择,no-resolve
  - RULE-SET,ip_telegram,自动选择,no-resolve
  - RULE-SET,ip_twitter,自动选择,no-resolve
  - RULE-SET,ip_cn,DIRECT,no-resolve
  # 全局兜底
  - MATCH,自动选择
