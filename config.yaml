# ======================================== 全局配置 ========================================
mixed-port: 7890
tproxy-port: 7893
ipv6: false
allow-lan: true
log-level: warning
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9090
external-ui: ui
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"

geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"
# ======================================== DNS ========================================
dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: false
  respect-rules: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: redir-host
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    'rule-set:AWAvenue-Ads,category-ads-all': rcode://success
    'rule-set:cloudflare,github,youtube,google,netflix,telegram,twitter,category-ai-!cn,geolocation-!cn':
    - https://cloudflare-dns.com/dns-query#disable-ipv6=true
    - https://dns.google/dns-query#disable-ipv6=true
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
# ======================================== 域名嗅探 ========================================
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
# ======================================== Tun模式 ========================================
tun:
  enable: false
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
# ======================================== 代理集合 ========================================
proxy-providers:
  nodes:
    type: http
    url: "https://raw.githubusercontent.com/swcndj/mihomoconfig/main/nodes.yaml"
    interval: 7200
    path: ./providers/nodes.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
# ======================================== 代理组 ========================================
proxy-groups:
  - name: "自动选择"
    type: url-test
    tolerance: 50
    disable-udp: false
    use:
    - bestnodes
  - name: "负载均衡"
    type: load-balance
    strategy: consistent-hashing
    disable-udp: false
    use:
    - bestnodes
